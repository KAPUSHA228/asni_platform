# АСНИ — объединённый стенд всех подсистем.
#
#   git clone --recurse-submodules <repo> && cd asni-platform
#   cp .env.example .env
#   docker compose up -d --build
#
# Точки входа (порты можно поменять в .env):
#   http://localhost:${LANDING_PORT:-80}      — стартовая страница со ссылками
#   http://localhost:${GATEWAY_PORT:-8080}    — API АСНИ (Java gateway)
#   http://localhost:${ML_PORT:-8101}         — мониторинг академических рисков (ML)
#   http://localhost:${CREATIVITY_PORT:-8102} — анализ креативности
#   http://localhost:${SURVEY_PORT:-8103}     — конструктор анкет
#
# Подсистема загрузки данных (JavaFX) — десктоп-клиент, в Docker не запускается,
# см. subsystems/data-loading/README.md.
#
# Принцип: код подсистем не меняется, здесь только сборка из сабмодулей
# и переопределение имён/портов, чтобы всё жило в одной сети без конфликтов.

x-jwt: &jwt_secret ${JWT_SECRET:-changeme-replace-in-production-256bit-secret-key!!}

services:

  # ════════════════════ Стартовая страница ════════════════════
  landing:
    image: nginx:1.27-alpine
    ports:
      - "${LANDING_PORT:-80}:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ════════════════════ АСНИ backend (Java, ASNI-UNN/*) ════════════════════
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck: &pg_health
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-redis:
    image: redis:7-alpine
    volumes:
      - auth-redis-data:/data
    healthcheck: &redis_health
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storage_db
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
    volumes:
      - storage-db-data:/var/lib/postgresql/data
    healthcheck: *pg_health

  survey-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: survey_db
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
    volumes:
      - survey-db-data:/var/lib/postgresql/data
    healthcheck: *pg_health

  auth-service:
    build: ./subsystems/asni/auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: auth
      DB_PASSWORD: auth
      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: *jwt_secret
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-Admin@1234!}
    depends_on:
      auth-db: { condition: service_healthy }
      auth-redis: { condition: service_healthy }
    restart: unless-stopped

  data-storage-service:
    build: ./subsystems/asni/data-storage-service
    environment:
      DB_URL: jdbc:postgresql://storage-db:5432/storage_db
      DB_USERNAME: storage
      DB_PASSWORD: storage
      JWT_SECRET: *jwt_secret
    depends_on:
      storage-db: { condition: service_healthy }
    restart: unless-stopped

  survey-service:
    build: ./subsystems/asni/survey-service
    environment:
      DB_URL: jdbc:postgresql://survey-db:5432/survey_db
      DB_USERNAME: survey
      DB_PASSWORD: survey
      JWT_SECRET: *jwt_secret
    depends_on:
      survey-db: { condition: service_healthy }
    restart: unless-stopped

  analytics-service:
    build: ./subsystems/asni/analytics-service
    environment:
      JWT_SECRET: *jwt_secret
      SURVEY_SERVICE_URL: http://survey-service:8083
    depends_on:
      - survey-service
    restart: unless-stopped

  gateway-service:
    build: ./subsystems/asni/gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      JWT_SECRET: *jwt_secret
      AUTH_SERVICE_URL: http://auth-service:8081
      STORAGE_SERVICE_URL: http://data-storage-service:8082
      SURVEY_SERVICE_URL: http://survey-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
    depends_on:
      - auth-service
      - data-storage-service
      - survey-service
      - analytics-service
    restart: unless-stopped

  # ════════════════════ ML: мониторинг академических рисков (KAPUSHA228/diplom) ════════════════════
  # Имена ml-api / ray-head сохранены: на них завязаны nginx-конфиг фронта и ray-worker.
  ml-redis:
    image: redis:7-alpine
    healthcheck: *redis_health

  ray-head:
    image: rayproject/ray:2.9.0-py311
    user: root
    shm_size: "4g"
    ports:
      - "${RAY_DASHBOARD_PORT:-8265}:8265"
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-cpus=${RAY_CPUS:-4} --disable-usage-stats --temp-dir=/tmp/ray --block
    environment:
      - RAY_TMPDIR=/tmp/ray
    volumes:
      - ray-data:/tmp/ray
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  ray-worker:
    image: rayproject/ray:2.9.0-py311
    user: root
    shm_size: "4g"
    command: ray start --address=ray-head:6379 --num-cpus=${RAY_CPUS:-4} --temp-dir=/tmp/ray --block
    environment:
      - PYTHONPATH=/app
      - RAY_TMPDIR=/tmp/ray
    volumes:
      - ./subsystems/ml-risk:/app
      - ray-data:/tmp/ray
    depends_on:
      ray-head: { condition: service_healthy }

  ml-api:
    build:
      context: ./subsystems/ml-risk
      # свой Dockerfile: кэш pip между сборками (см. docker/ml-api.Dockerfile)
      dockerfile: ../../docker/ml-api.Dockerfile
    environment:
      - REDIS_URL=redis://ml-redis:6379/0
      - DEBUG=false
      - PYTHONPATH=/app
    volumes:
      - ./subsystems/ml-risk:/app
      - ml-models:/app/models
      - ml-logs:/app/logs
      - ml-experiments:/app/experiments
    depends_on:
      ml-redis: { condition: service_healthy }
      ray-head: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  ml-frontend:
    build:
      context: ./subsystems/ml-risk
      dockerfile: Dockerfile.frontend
    ports:
      - "${ML_PORT:-8101}:80"
    volumes:
      - ./subsystems/ml-risk/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-api
    restart: unless-stopped

  # ════════════════════ Анализ креативности (ermilovad/creativity-analysis-subsystem) ════════════════════
  creativity-db:
    image: postgres:15
    environment:
      POSTGRES_DB: creativity
      POSTGRES_USER: creativity
      POSTGRES_PASSWORD: creativity
    volumes:
      - creativity-db-data:/var/lib/postgresql/data
    healthcheck: *pg_health

  creativity-redis:
    image: redis:7-alpine
    healthcheck: *redis_health

  creativity-web:
    # свой Dockerfile: CPU-версия PyTorch и кэш pip (см. docker/creativity.Dockerfile)
    build:
      context: ./subsystems/creativity
      dockerfile: ../../docker/creativity.Dockerfile
    image: asni-platform-creativity
    # migrate добавлен здесь: в исходном compose его нет, без него пустая БД не заработает
    command: sh -c "python manage.py migrate --noinput && gunicorn creativity_platform.wsgi:application --bind 0.0.0.0:8000 --timeout 300"
    environment: &creativity_env
      SECRET_KEY: ${CREATIVITY_SECRET_KEY:-change_me}
      DEBUG: "0"
      DB_NAME: creativity
      DB_USER: creativity
      DB_PASSWORD: creativity
      DB_HOST: creativity-db
      DB_PORT: "5432"
      ST_MODEL: ${CREATIVITY_ST_MODEL:-paraphrase-multilingual-mpnet-base-v2}
      MIN_LEMS: "5"
      KMEANS_MIN: "2"
      KMEANS_MAX: "7"
      CELERY_BROKER: redis://creativity-redis:6379/0
    ports:
      - "${CREATIVITY_PORT:-8102}:8000"
    networks:
      default:
        # имя, по которому к подсистеме обращается конструктор анкет (http_client.py)
        aliases: [creative-mfe]
    volumes:
      - hf-cache:/root/.cache
    depends_on:
      creativity-db: { condition: service_healthy }
      creativity-redis: { condition: service_healthy }
    restart: unless-stopped

  creativity-worker:
    # тот же образ, что у creativity-web — не собирается второй раз
    image: asni-platform-creativity
    pull_policy: never
    command: celery -A creativity_platform worker -l warning
    environment: *creativity_env
    volumes:
      - hf-cache:/root/.cache
    depends_on:
      creativity-db: { condition: service_healthy }
      creativity-redis: { condition: service_healthy }
    restart: unless-stopped

  # ════════════════════ Конструктор анкет (sanya2905/survey-constructor-service) ════════════════════
  # Имя survey-api сохранено: на него завязан nginx-конфиг фронта.
  # БД переименована в constructor-db, т.к. survey-db уже занят Java survey-service.
  constructor-db:
    image: postgres:16
    environment:
      POSTGRES_DB: survey_db
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
    volumes:
      - constructor-db-data:/var/lib/postgresql/data
    healthcheck: *pg_health

  survey-api:
    build: ./subsystems/survey-constructor/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://survey:survey@constructor-db:5432/survey_db
      ALEMBIC_SKIP_HOST_REWRITE: "1"
      POSTGRES_HOST: constructor-db
      JWT_SECRET_KEY: ${CONSTRUCTOR_JWT_SECRET:-changeme}
      CORS_ORIGINS: http://localhost:${SURVEY_PORT:-8103},http://localhost:5173
      REGISTRATION_OPEN: "true"
      CREATIVE_API_URL: http://creative-mfe:8000
    depends_on:
      constructor-db: { condition: service_healthy }
    restart: on-failure

  survey-frontend:
    build: ./subsystems/survey-constructor/frontend
    ports:
      - "${SURVEY_PORT:-8103}:80"
    depends_on:
      - survey-api
    restart: unless-stopped

volumes:
  auth-db-data:
  auth-redis-data:
  storage-db-data:
  survey-db-data:
  ray-data:
  ml-models:
  ml-logs:
  ml-experiments:
  creativity-db-data:
  hf-cache:
  constructor-db-data:
